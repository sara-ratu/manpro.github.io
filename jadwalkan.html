<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwalkan Konsultasi - ProConsult</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body class="font-sans">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white shadow-md rounded-lg p-6">
            <h1 class="text-3xl font-bold text-purple-700 mb-6">Jadwalkan Konsultasi</h1>
            
            <form class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-bold mb-2" for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-bold mb-2" for="email">Email</label>
                    <input type="email" id="email" name="email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-bold mb-2" for="layanan">Layanan Konsultasi</label>
                    <select id="layanan" name="layanan" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="">Pilih Layanan</option>
                        <option value="it">Konsultasi Infrastruktur IT</option>
                        <option value="pajak">Konsultasi Pajak Komprehensif</option>
                        <option value="strategi">Konsultasi Strategi Bisnis</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-bold mb-2" for="tanggal">Tanggal Konsultasi</label>
                    <input type="date" id="tanggal" name="tanggal" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-bold mb-2" for="pesan">Pesan Tambahan</label>
                    <textarea id="pesan" name="pesan" rows="4" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
                </div>
                
                <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 transition duration-300">
                    Kirim Permintaan Konsultasi
                </button>
            </form>
        </div>
    </div>
</body>
</html>
